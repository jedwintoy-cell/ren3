# 1 control-plane + 2 workers, as required by the case.
# The image is a thin wrapper around kindest/node:v1.31.12 that forces systemd
# into legacy cgroup v1 mode (see cluster/Containerfile for why).
# Build it and create the cluster with: ./cluster/create-cluster.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    image: localhost/kind-node-cgv1:v1.31.12
  - role: worker
    image: localhost/kind-node-cgv1:v1.31.12
  - role: worker
    image: localhost/kind-node-cgv1:v1.31.12
