# Redis 7 as a plain Deployment + Service.
# The password comes from Secret "redis-auth" (created by scripts/deploy.sh,
# never committed to git). No persistence: the queue is lost if the pod dies,
# which is acceptable for this demo (see README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ingest
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          # $(REDIS_PASSWORD) is expanded by Kubernetes from the env var below.
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: password }
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ingest
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: redis
