# Reaper (bonus): re-queues jobs stuck in 'processing'.
#
# The SIGTERM fix only helps when the worker is asked to stop. If it is killed
# hard (SIGKILL, OOM, node crash) the job it held stays in 'processing' forever.
#
# Rule (two-pass, no worker changes needed): a job is stuck if it was already
# in 'processing' on the previous run, i.e. >= 1 minute ago. A job takes at
# most 5s, so a healthy worker never holds one that long. The previous run's
# snapshot is kept in the Redis set 'reaper:seen'.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reaper-script
  namespace: ingest
data:
  reaper.sh: |
    #!/bin/bash
    rcli() { redis-cli -h "$REDIS_HOST" -a "$REDIS_PASSWORD" --no-auth-warning "$@"; }

    # Atomic: only re-queue if the job is still in 'processing'; if a worker
    # finished it meanwhile, LREM returns 0 and nothing happens.
    REQUEUE="if redis.call('LREM', KEYS[1], 1, ARGV[1]) == 1 then
               redis.call('LPUSH', KEYS[2], ARGV[1]) return 1 end
             return 0"

    requeued=0
    for job in $(rcli SMEMBERS reaper:seen); do
      if [ "$(rcli EVAL "$REQUEUE" 2 processing jobs "$job")" = 1 ]; then
        echo "re-queued stuck job $job"
        rcli INCR requeued >/dev/null    # total, for observability
        requeued=$((requeued + 1))
      fi
    done

    # Remember what is in flight now; the next run re-queues whatever is still there.
    rcli DEL reaper:seen >/dev/null
    current=$(rcli LRANGE processing 0 -1)
    [ -n "$current" ] && rcli SADD reaper:seen $current >/dev/null
    echo "re-queued=$requeued, watching $(rcli SCARD reaper:seen) in-flight job(s)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reaper
  namespace: ingest
spec:
  schedule: "* * * * *"          # every minute (cron's smallest interval)
  concurrencyPolicy: Forbid      # never two reapers at once
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reaper
              image: redis:7
              command: ["/bin/bash", "/scripts/reaper.sh"]
              envFrom:
                - configMapRef: { name: worker-config }
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: redis-auth, key: password }
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits:   { cpu: 100m, memory: 32Mi }
          volumes:
            - name: script
              configMap: { name: reaper-script }
